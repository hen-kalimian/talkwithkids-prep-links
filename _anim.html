<!--anim-29-10--><style id="anim-css">
.rv{opacity:0;transform:translateY(10px);transition:opacity .45s ease,transform .45s ease}
.rv.in{opacity:1;transform:none}
@keyframes cta{0%,100%{box-shadow:0 8px 22px rgba(239,64,110,.28)}50%{box-shadow:0 10px 30px rgba(239,64,110,.48)}}
a.btn{animation:cta 4.2s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}a.btn{animation:none}}
</style><script id="anim-js">
(function(){try{
if(matchMedia('(prefers-reduced-motion:reduce)').matches||!('IntersectionObserver'in window))return;
var els=[].slice.call(document.querySelectorAll('.pstat,.stat'));
els.forEach(function(e){e.classList.add('rv')});
var fired=0;
var io=new IntersectionObserver(function(en){en.forEach(function(x){fired++;if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}})},{threshold:0.3});
els.forEach(function(e){io.observe(e)});
setTimeout(function(){if(!fired)els.forEach(function(e){e.classList.add('in')})},2500);
}catch(e){}})();
</script>
